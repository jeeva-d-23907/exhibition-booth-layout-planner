<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="content-type" content="text/html;charset=UTF-8">
    <title>Request a Quote</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <style>
        .wf_customMessageBox {
            font-family: Arial, Helvetica, sans-serif;
            color: #132c14;
            background: #f5faf5;
            box-shadow: 0 2px 6px 0 rgba(0, 0, 0, 0.25);
            max-width: 90%;
            width: max-content;
            word-break: break-word;
            z-index: 11000;
            border-radius: 6px;
            border: 1px solid #a9d3ab;
            min-width: 100px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translate(-50%, 0);
        }

        .wf_customCircle {
            position: relative;
            background-color: #12aa67;
            border-radius: 100%;
            width: 20px;
            height: 20px;
            flex: none;
            margin-right: 7px;
        }

        .wf_customCheckMark {
            box-sizing: unset !important;
            position: absolute;
            transform: rotate(45deg) translate(-50%, -50%);
            left: 6px;
            top: 9px;
            height: 8px;
            width: 3px;
            border-bottom: 2px solid #fff;
            border-right: 2px solid #fff;
        }

        body {
            background-color: #666666;
            margin: 0;
            padding: 40px 20px;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        #crmWebToEntityForm {
            background-color: #ffffff;
            max-width: 750px;
            margin: 0 auto;
            padding: 50px 60px;
            box-sizing: border-box;
            color: #333333;
        }

        .form-header {
            margin-bottom: 40px;
        }

        .pre-title {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 10px;
        }

        .pre-title::before {
            content: "";
            display: block;
            width: 40px;
            height: 2px;
            background-color: #8cba51;
        }

        .form-header h2 {
            font-family: Georgia, serif;
            font-size: 42px;
            font-weight: 400;
            margin: 0 0 15px;
            color: #85b04e;
        }

        .form-header h2 em {
            font-style: italic;
        }

        .form-header p {
            font-size: 15px;
            line-height: 1.6;
            color: #444;
            margin: 0;
            max-width: 90%;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #85b04e;
            margin-bottom: 8px;
        }

        .form-group input[type="text"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            background-color: #efefef;
            border: none;
            border-radius: 6px;
            padding: 14px 15px;
            font-size: 14px;
            color: #333;
            box-sizing: border-box;
            font-family: inherit;
            outline: none;
            transition: background-color 0.2s;
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            background-color: #e4e4e4;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .name-fields {
            display: flex;
            gap: 10px;
        }

        .submit-btn-container {
            margin-top: 30px;
        }

        .formsubmit.zcwf_button {
            background-color: #85b04e !important;
            color: #2b3a1d !important;
            font-size: 15px !important;
            font-weight: 700 !important;
            border: none !important;
            border-radius: 6px !important;
            padding: 14px 28px !important;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: background-color 0.2s ease;
        }

        .formsubmit.zcwf_button:hover {
            background-color: #51692f !important;
        }

        .formsubmit.zcwf_button svg {
            width: 18px;
            height: 18px;
        }

        @media (max-width: 600px) {
            #crmWebToEntityForm {
                padding: 30px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .name-fields {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="wf_customMessageBox" id="wf_splash" style="display:none">
        <div class="wf_customCircle">
            <div class="wf_customCheckMark"></div>
        </div>
        <span id="wf_splash_info"></span>
    </div>

    <div id="crmWebToEntityForm" class="crmWebToEntityForm">
        <div class="form-header">
            <div class="pre-title">GET IN TOUCH</div>
            <h2>Request a <em>Quote</em></h2>
            <p>No job is too small for us. Please submit your requirements and we'll get back to you within 24 hours with a detailed quote.</p>
        </div>

        <form id="webform102169000001979020" name="WebToLeads102169000001979020" accept-charset="UTF-8">
            <input type="text" style="display:none;" name="xnQsjsdp" value="e6824a51c7ded5350d44708b359b034bbfc5324e9ac25ec9673d3a0bc1165fcc">
            <input type="hidden" name="zc_gad" id="zc_gad" value="">
            <input type="text" style="display:none;" name="xmIwtLD" value="294f68314aec72f19b7c395ef543612022576a105572d6a30bcffeb0f62cec8e11c6062f9ca575544531b15ee96b3e59">
            <input type="text" style="display:none;" name="actionType" value="TGVhZHM=">
            <input type="text" style="display:none;" name="returnURL" value="null">
            <input type="text" style="display:none;" name="aG9uZXlwb3Q" value="">

            <div class="form-grid">
                <div class="form-group">
                    <label for="First_Name">Your Name *</label>
                    <div class="name-fields">
                        <input type="text" id="First_Name" aria-required="true" aria-label="First Name" name="First Name" placeholder="First" maxlength="40">
                        <input type="text" id="Last_Name" aria-required="true" aria-label="Last Name" name="Last Name" placeholder="Last" maxlength="80">
                    </div>
                </div>

                <div class="form-group">
                    <label for="Email">Email Address *</label>
                    <input type="text" ftype="email" autocomplete="false" id="Email" aria-required="true" aria-label="Email" name="Email" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="Phone">Phone Number</label>
                    <input type="text" id="Phone" aria-required="false" aria-label="Phone" name="Phone" maxlength="30">
                </div>

                <div class="form-group">
                    <label for="LEADCF12">Service Interested In</label>
                    <select id="LEADCF12" aria-label="LEADCF12" name="LEADCF12">
                        <option value="-None-">Select a service</option>
                        <option value="Option&#x20;1">Option 1</option>
                        <option value="Option&#x20;2">Option 2</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="Street">Street Address</label>
                    <input type="text" id="Street" aria-required="false" aria-label="Street" name="Street" maxlength="250">
                </div>

                <div class="form-group">
                    <label for="City">City</label>
                    <input type="text" id="City" aria-required="false" aria-label="City" name="City" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="Zip_Code">Pincode</label>
                    <input type="text" id="Zip_Code" aria-required="false" aria-label="Zip Code" name="Zip Code" maxlength="30">
                </div>

                <div class="form-group full-width">
                    <label for="Description">Your Message *</label>
                    <textarea id="Description" aria-required="true" aria-label="Description" name="Description"></textarea>
                </div>
            </div>

            <div class="submit-btn-container">
                <button type="submit" id="formsubmit" class="formsubmit zcwf_button" aria-label="Submit" title="Submit">
                    Send Message
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <script>
        function validateEmail102169000001979020() {
            var form = document.forms["WebToLeads102169000001979020"];
            var emailFld = form.querySelectorAll("[ftype=email]");
            var i;
            for (i = 0; i < emailFld.length; i++) {
                var emailVal = emailFld[i].value;
                if ((emailVal.replace(/^\s+|\s+$/g, "")).length !== 0) {
                    var atpos = emailVal.indexOf("@");
                    var dotpos = emailVal.lastIndexOf(".");
                    if (atpos < 1 || dotpos < atpos + 2 || dotpos + 2 >= emailVal.length) {
                        alert("Please enter a valid email address.");
                        emailFld[i].focus();
                        return false;
                    }
                }
            }
            return true;
        }

        function checkMandatory102169000001979020() {
            var mndFileds = ["First Name", "Last Name", "Email", "Description"];
            var fldLangVal = ["First\x20Name", "Last\x20Name", "Email", "Your\x20Message"];
            var i;

            for (i = 0; i < mndFileds.length; i++) {
                var fieldObj = document.forms["WebToLeads102169000001979020"][mndFileds[i]];
                if (fieldObj) {
                    if (((fieldObj.value).replace(/^\s+|\s+$/g, "")).length === 0) {
                        if (fieldObj.type === "file") {
                            alert("Please select a file to upload.");
                            fieldObj.focus();
                            return false;
                        }
                        alert(fldLangVal[i] + " cannot be empty.");
                        fieldObj.focus();
                        return false;
                    } else if (fieldObj.nodeName === "SELECT") {
                        if (fieldObj.options[fieldObj.selectedIndex].value === "-None-") {
                            alert(fldLangVal[i] + " cannot be none.");
                            fieldObj.focus();
                            return false;
                        }
                    } else if (fieldObj.type === "checkbox") {
                        if (fieldObj.checked === false) {
                            alert("Please accept " + fldLangVal[i]);
                            fieldObj.focus();
                            return false;
                        }
                    }
                }
            }

            if (!validateEmail102169000001979020()) {
                return false;
            }

            var urlparams = new URLSearchParams(window.location.search);
            if (urlparams.has("service") && urlparams.get("service") === "smarturl") {
                var webform = document.getElementById("webform102169000001979020");
                var service = urlparams.get("service");
                var smarturlfield = document.createElement("input");
                smarturlfield.setAttribute("type", "hidden");
                smarturlfield.setAttribute("value", service);
                smarturlfield.setAttribute("name", "service");
                webform.appendChild(smarturlfield);
            }

            document.querySelector(".crmWebToEntityForm .formsubmit").setAttribute("disabled", true);
            return true;
        }

        $(document).ready(function () {
            $("#webform102169000001979020").submit(function (e) {
                var ismandatory = checkMandatory102169000001979020();
                e.preventDefault();
                if (ismandatory) {
                    if (typeof _wfa_track !== "undefined" && _wfa_track.wfa_submit) {
                        _wfa_track.wfa_submit(e);
                    }

                    var formData = new FormData(this);
                    $.ajax({
                        url: "https://crm.zoho.com.au/crm/WebToLeadForm",
                        type: "POST",
                        data: formData,
                        cache: false,
                        contentType: false,
                        processData: false,
                        success: function (data) {
                            var splashinfodom = document.getElementById("wf_splash_info");
                            splashinfodom.innerText = data.actionvalue;
                            var splashdom = document.getElementById("wf_splash");
                            document.getElementById("webform102169000001979020").reset();
                            splashdom.style.display = "";
                            setTimeout(function () {
                                splashdom.style.display = "none";
                            }, 5000);
                            document.querySelector(".crmWebToEntityForm .formsubmit").removeAttribute("disabled");
                        },
                        error: function () {
                            alert("An error occurred.");
                            document.querySelector(".crmWebToEntityForm .formsubmit").removeAttribute("disabled");
                        }
                    });
                }
            });
        });
    </script>
